services:
  whook:
    build: .
    image: whook:latest
    ports:
      - "8080:8080"
    environment:
      WHOOK_ADDR: ":8080"
      WHOOK_DATABASE_URL: "file:/data/whook.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
      # Set these in a .env file or your shell. Empty admin token leaves the
      # management API open, which is only safe for local use.
      WHOOK_ADMIN_TOKEN: "${WHOOK_ADMIN_TOKEN:-}"
      WHOOK_SECRET_KEY: "${WHOOK_SECRET_KEY:-}"
      WHOOK_WORKERS: "${WHOOK_WORKERS:-4}"
    volumes:
      - whook-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  whook-data:
